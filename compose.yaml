services:
  app:
    image: ${IMAGE:-hello-swarm}:${VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    environment:
      HTTP_ADDR: ":8080"
      HEALTHCHECK_URL: "http://127.0.0.1:8080/healthz"
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
