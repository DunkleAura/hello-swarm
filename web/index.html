<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hello Swarm</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Live topology</p>
      <h1>Hello, <span>Swarm.</span></h1>
      <p class="intro">Jede Antwort macht eine laufende Container-Instanz sichtbar.</p>
    </div>
    <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <main>
    <section class="controls" aria-label="Polling-Steuerung">
      <div class="status-line">
        <span id="status-dot" class="status-dot"></span>
        <strong id="status">Verbinde...</strong>
      </div>
      <label for="interval">Intervall</label>
      <div class="interval-control">
        <input id="interval" type="number" value="5" min="1" max="3600" inputmode="numeric">
        <span>Sekunden</span>
      </div>
      <button id="toggle" type="button">Pausieren</button>
      <div class="state-counts" aria-label="Instanzstatus">
        <span class="online"><strong id="online-count">0</strong> online</span>
        <span class="missing"><strong id="missing-count">0</strong> vermisst</span>
        <span class="offline"><strong id="offline-count">0</strong> offline</span>
      </div>
    </section>

    <section>
      <div id="instances" class="instances" aria-live="polite"></div>
      <div id="empty" class="empty">
        <span>01</span>
        <p>Warte auf die erste Container-Antwort.</p>
      </div>
    </section>
  </main>

  <footer>Stateless discovery via HTTP</footer>
</body>
</html>
